name: CI and ARM64 deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Test frontend and backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ctu-chatbot-fe/package-lock.json

      - name: Build frontend
        working-directory: ctu-chatbot-fe
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ctu-chatbot-be/requirements.txt

      - name: Test backend
        working-directory: ctu-chatbot-be
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q -m "not live"

  publish:
    name: Build and publish ARM64 images
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_owner: ${{ steps.names.outputs.owner }}
      image_name: ${{ steps.names.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize package names
        id: names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          name="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ctu-chatbot-be/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.name }}-backend:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.name }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Validate frontend deployment config
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "Missing repository variable VITE_GOOGLE_CLIENT_ID"; exit 1; }
      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ctu-chatbot-fe
          file: ctu-chatbot-fe/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.name }}-frontend:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.name }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to ARM64 server
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment manifest
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing DEPLOY_SSH_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy Compose manifest and prepare server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing repository secret DEPLOY_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing repository secret DEPLOY_SSH_USER"; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'test -d /home/opc/projects/ctu-chatbot && test -w /home/opc/projects/ctu-chatbot'
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:/home/opc/projects/ctu-chatbot/docker-compose.prod.yml"

      - name: Pull and start the release
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          IMAGE_OWNER: ${{ needs.publish.outputs.image_owner }}
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "IMAGE_OWNER='$IMAGE_OWNER' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -eu
          cd /home/opc/projects/ctu-chatbot
          test -f ctu-chatbot-be/.env || { echo "Create /home/opc/projects/ctu-chatbot/ctu-chatbot-be/.env before deploying"; exit 1; }
          docker compose --env-file ctu-chatbot-be/.env -f docker-compose.prod.yml pull
          docker compose --env-file ctu-chatbot-be/.env -f docker-compose.prod.yml up -d --remove-orphans
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "Deployment is healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file ctu-chatbot-be/.env -f docker-compose.prod.yml ps
          echo "Frontend health check timed out"
          exit 1
          REMOTE
