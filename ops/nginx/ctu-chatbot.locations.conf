root /usr/share/nginx/html/ctu-chatbot/current;
index index.html;

location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location = /index.html {
    expires -1;
}

location = / {
    # Keep edge-injected scripts off the public landing page.
    add_header Cache-Control "no-cache, no-transform";
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    try_files /index.html =404;
}

location ~ ^/(robots|llms)\.txt$ {
    try_files $uri =404;
    charset utf-8;
}

location = /.well-known/ard.json {
    try_files $uri =404;
}

location = /.well-known/ai-catalog.json {
    rewrite ^ /.well-known/ard.json last;
}

location = /ai-catalog.json {
    rewrite ^ /.well-known/ard.json last;
}

location ^~ /assets/ {
    try_files $uri @ctu_previous_assets;
    expires 1y;
}

location @ctu_previous_assets {
    root /usr/share/nginx/html/ctu-chatbot/previous;
    try_files $uri =404;
    expires 1y;
}

location / {
    try_files $uri $uri/ /index.html;
}
