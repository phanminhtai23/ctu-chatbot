name: CI and ARM64 deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Test frontend and backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ctu-chatbot-fe/package-lock.json

      - name: Build frontend
        working-directory: ctu-chatbot-fe
        env:
          VITE_API_BASE_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main ]]; then
            test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "Missing repository variable VITE_GOOGLE_CLIENT_ID"; exit 1; }
          fi
          npm ci
          npm run lint
          npm run build

      - name: Archive frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf frontend.tar.gz -C ctu-chatbot-fe/dist .

      - name: Upload frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ctu-chatbot-be/requirements.txt

      - name: Test backend
        working-directory: ctu-chatbot-be
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q -m "not live"

  publish:
    name: Build and publish ARM64 backend
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_owner: ${{ steps.names.outputs.owner }}
      image_name: ${{ steps.names.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize package names
        id: names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          name="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ctu-chatbot-be/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.name }}-backend:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.name }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy to ARM64 server
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment manifest
        uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: release

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing DEPLOY_SSH_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend and static frontend
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          IMAGE_OWNER: ${{ needs.publish.outputs.image_owner }}
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing repository secret DEPLOY_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing repository secret DEPLOY_SSH_USER"; exit 1; }
          target="$SSH_USER@$SSH_HOST"
          ssh_cmd=(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$target")
          stage=$("${ssh_cmd[@]}" 'mktemp -d /home/opc/projects/ctu-chatbot/.deploy.XXXXXXXX')
          [[ "$stage" =~ ^/home/opc/projects/ctu-chatbot/\.deploy\.[a-zA-Z0-9]{8}$ ]]
          trap '"${ssh_cmd[@]}" "rm -rf -- $stage" || true' EXIT
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" docker-compose.prod.yml release/frontend.tar.gz \
            ops/deploy-host.sh ops/nginx/ctu-chatbot.locations.conf "$target:$stage/"
          "${ssh_cmd[@]}" "IMAGE_OWNER='$IMAGE_OWNER' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' bash '$stage/deploy-host.sh' '$stage'"
