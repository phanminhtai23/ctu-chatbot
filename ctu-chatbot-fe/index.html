<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-ctu.png" />
    <link rel="preload" as="image" href="/ctu-chatbot-logo.webp" type="image/webp" />
    <link rel="preload" as="image" href="/ctu-chatbot-avatar.webp" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet" />
    <title>CTU Chatbot</title>
    <script>
      // Áp theme/ngôn ngữ trước khi React render để tránh nháy giao diện.
      try {
        var theme = localStorage.getItem('ctu-theme')
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var lang = localStorage.getItem('ctu-lang')
        if (lang === 'vi' || lang === 'en') document.documentElement.lang = lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
