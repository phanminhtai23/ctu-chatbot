<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Tra cứu quy chế học vụ Đại học Cần Thơ về tín chỉ, điểm, học bổng và tốt nghiệp. CTU Chatbot giải đáp bằng tiếng Việt và dẫn nguồn văn bản." />
    <link rel="icon" type="image/png" href="/favicon-ctu.png" />
    <link rel="ard" href="/.well-known/ard.json" type="application/json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="font" href="/src/assets/readex-pro-latin.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/src/assets/readex-pro-vietnamese.woff2" type="font/woff2" crossorigin />
    <title>CTU Chatbot</title>
    <script>
      // Áp theme/ngôn ngữ trước khi React render để tránh nháy giao diện.
      try {
        var theme = localStorage.getItem('ctu-theme')
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var lang = localStorage.getItem('ctu-lang')
        if (lang === 'vi' || lang === 'en') document.documentElement.lang = lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
